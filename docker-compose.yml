version: '3.8'

services:
  printers-service:
    build: 
      context: ./services/printers-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - LOG_LEVEL=info
    volumes:
      - ./services/printers-service:/app
    depends_on:
      - postgres
    networks:
      - printing-network

  monitoring-service:
    build: 
      context: ./services/monitoring-service
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - APP_ENV=development
      - LOG_LEVEL=info
    volumes:
      - ./services/monitoring-service:/app
    depends_on:
      - postgres
    networks:
      - printing-network

  calibration-service:
    build: 
      context: ./services/calibration-service
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    environment:
      - APP_ENV=development
      - LOG_LEVEL=info
    volumes:
      - ./services/calibration-service:/app
    depends_on:
      - postgres
    networks:
      - printing-network

  postgres:
    image: postgres:13-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=printing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - printing-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - printing-network

networks:
  printing-network:
    driver: bridge

volumes:
  postgres_data:
