version: '3.8'

services:
  printers-service:
    build: 
      context: ./services/printers-service
      dockerfile: Dockerfile
    container_name: printers-service
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - LOG_LEVEL=info
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/printing_db
    volumes:
      - ./services/printers-service:/app
    depends_on:
      - postgres
    networks:
      - printing-network

  monitoring-service:
    build: 
      context: ./services/monitoring-service
      dockerfile: Dockerfile
    container_name: monitoring-service
    ports:
      - "8002:8000"
    environment:
      - APP_ENV=development
      - LOG_LEVEL=info
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/printing_db
      - PRINTERS_SERVICE_URL=http://printers-service:8000
      - CALIBRATION_SERVICE_URL=http://calibration-service:8000
    volumes:
      - ./services/monitoring-service:/app
    depends_on:
      - printers-service
      - calibration-service
    networks:
      - printing-network

  calibration-service:
    build: 
      context: ./services/calibration-service
      dockerfile: Dockerfile
    container_name: calibration-service
    ports:
      - "8001:8000"
    environment:
      - APP_ENV=development
      - LOG_LEVEL=info
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/printing_db
      - PRINTERS_SERVICE_URL=http://printers-service:8000
    volumes:
      - ./services/calibration-service:/app
    depends_on:
      - printers-service
    networks:
      - printing-network

  postgres:
    image: postgres:13-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=printing_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - printing-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - printing-network

networks:
  printing-network:
    driver: bridge

volumes:
  postgres_data:
